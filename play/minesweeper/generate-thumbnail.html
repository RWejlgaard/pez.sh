<!DOCTYPE html>
<html>
<head>
    <title>Generate Thumbnail</title>
</head>
<body>
    <canvas id="canvas" width="300" height="200"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 300, 200);

        // Draw a small minesweeper grid
        const gridSize = 8;
        const tileSize = 20;
        const startX = (300 - gridSize * tileSize) / 2;
        const startY = (200 - gridSize * tileSize) / 2;

        const colors = {
            revealed: '#1a1a1a',
            unrevealed: '#404040',
            border: '#808080',
            mine: '#ff0000',
            flag: '#ff8800',
            text: '#ffffff',
            numbers: {
                1: '#00ffff',
                2: '#00ff00',
                3: '#ff0000'
            }
        };

        // Sample grid
        const grid = [
            [' ', ' ', '1', 'X', 'F', 'X', 'X', 'X'],
            [' ', ' ', '1', '2', '3', 'X', 'X', 'X'],
            [' ', ' ', ' ', ' ', '1', 'X', 'X', 'X'],
            ['1', '1', ' ', ' ', '1', 'X', 'F', 'X'],
            ['F', '1', ' ', ' ', '1', '2', '3', 'X'],
            ['1', '1', ' ', ' ', ' ', ' ', '1', 'X'],
            [' ', ' ', ' ', ' ', ' ', ' ', '1', 'X'],
            [' ', ' ', ' ', ' ', ' ', ' ', '1', 'X']
        ];

        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                const px = startX + x * tileSize;
                const py = startY + y * tileSize;
                const cell = grid[y][x];

                if (cell === 'X') {
                    // Unrevealed
                    ctx.fillStyle = colors.unrevealed;
                    ctx.fillRect(px + 1, py + 1, tileSize - 2, tileSize - 2);
                } else if (cell === 'F') {
                    // Flag
                    ctx.fillStyle = colors.unrevealed;
                    ctx.fillRect(px + 1, py + 1, tileSize - 2, tileSize - 2);
                    ctx.fillStyle = colors.flag;
                    ctx.font = '14px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('F', px + tileSize / 2, py + tileSize / 2);
                } else {
                    // Revealed
                    ctx.fillStyle = colors.revealed;
                    ctx.fillRect(px, py, tileSize, tileSize);

                    if (cell !== ' ') {
                        ctx.fillStyle = colors.numbers[cell] || colors.text;
                        ctx.font = '12px monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(cell, px + tileSize / 2, py + tileSize / 2);
                    }
                }

                // Border
                ctx.strokeStyle = colors.border;
                ctx.lineWidth = 1;
                ctx.strokeRect(px, py, tileSize, tileSize);
            }
        }

        // Download
        setTimeout(() => {
            const link = document.createElement('a');
            link.download = 'thumbnail.png';
            link.href = canvas.toDataURL();
            link.click();
            document.body.innerHTML = '<p>Thumbnail generated! Check your downloads folder.</p>';
        }, 100);
    </script>
</body>
</html>
